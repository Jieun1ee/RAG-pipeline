# 실행에 필요한 설정. 값을 바꾸면 코드를 고치지 않고 동작을 조절할 수 있다.

models:
  generator: "gpt-4.1-mini"        # 글을 쓰는 모델. `python -m core.llm --list`로 쓸 수 있는 이름을 확인한다
  judge: "gpt-4o-mini"           # 판정하는 모델. 생성과 다른 계열로 두어야 자기 글을 그대로 통과시키지 않는다
  temperature: 0

retry:                 # 다시 시도할 횟수. 시험 삼아 돌릴 때는 0이나 1로 낮춘다 (--retry N은 아래 전부를 N으로 맞춘다)
  retrieval: 2
  citation: 2
  synthesis: 2
  report: 2
  dispatch: 1          # 실행이 예외로 끝난(error) task를 오케스트레이터가 다시 보내는 횟수. 결과가 빈 task는 대상이 아니다

retrieval:
  top_k: 6             # 질의 하나가 가져올 검색 결과 수
  rrf_k: 60            # 두 검색 순위를 합칠 때 쓰는 상수. 클수록 등수 차이를 완만하게 본다
  web_max_results: 5

execution:
  technologies: [MLA, ITME]
  criteria_limit: null # 숫자를 넣으면 관점마다 앞쪽 기준만 본다. 전체를 돌리기 전 확인용
  max_concurrency: 8   # 동시에 도는 worker 수. 429(호출 한도 초과)가 나면 낮추고, 캐시가 차 있으면 올려도 된다

orchestration:         # 오케스트레이터가 계획을 나누고 다시 세우는 범위
  max_replans: 1       # 첫 계획 뒤 빈 곳을 메우려 다시 계획하는 횟수
  max_followup_tasks: 12  # 재계획 한 번에 추가할 task 수. 넘치면 균형 검사 빈칸부터 채운다
  max_steps: 30        # 메인 노드 실행 횟수 상한. 예상 최대치는 22이고, 넘으면 남은 일을 미확인으로 두고 종합으로 넘어간다
  recursion_limit: 50  # LangGraph 단계 수 상한. max_steps가 먼저 걸려야 정상이고 이것은 마지막 안전장치다
  # 계획 커버리지는 값이 아니라 규칙이다. 관점 평가의 모든 기준 × 기술이 계획에 있어야 하고, 빠지면 코드가 채운다

cache:
  enabled: true
  dir: outputs/cache

paths:
  registry: data/registry.yaml
  index_dir: outputs/index
  report: outputs/report.md
  checkpoint: outputs/checkpoints.sqlite  # 실행 중 상태 저장소. run_id가 thread_id라 --resume RUN_ID로 이어서 돌린다
