# 평가 대상과 원문 목록.
# 검색 결과와 보고서 출처에 들어가는 제목, 저자, 발행처는 전부 이 파일에서 가져온다.
# 모델이 서지 정보를 지어내지 못하게 하려는 것이다.
domain: 데이터센터 기반 LLM Serving
selected_tech:
  - technology: MLA
    camp: SW
    name: DeepSeek-V2 MLA (Multi-head Latent Attention)
    reason: >-
      KV 캐시를 저차원 잠재 벡터로 압축해 추론 시 KV 캐시 메모리를 크게 줄이는 어텐션 구조.
      공개 모델(DeepSeek-V2)과 논문으로 구현·수치가 공개되어 있어 SW 진영의 KV 캐시 절감 기술을 대표한다.
  - technology: ITME
    camp: HW
    name: ITME (Inference Tiered Memory Expansion)
    reason: >-
      CXL 기반 분리형 하이브리드 메모리로 추론 시 KV 캐시를 계층화해 GPU 메모리 밖으로 확장하는 구조.
      메모리 제조사(SK hynix)가 제안한 HW 진영의 KV 캐시 확장 기술을 대표한다.
