# 이해관계자 항목. 주체마다 기대하는 것과 감수해야 하는 것을 나누어 본다.
# 앞의 세 항목은 두 축으로 판정하고, 뒤의 두 항목은 지켜보기만 하므로 판정 축을 두지 않는다.
perspective: stakeholder
name: 이해관계자
basis: 데이터센터 LLM 서빙 가치사슬의 주체별 기대 효과와 도입 부담
result_type: level
levels:                       # 두 축 모두 같은 3단계를 쓴다
  높음: 공개 근거가 그 효과(또는 부담)가 크다는 것을 직접 보여 준다
  중간: 효과(또는 부담)가 있으나 조건부이거나 근거가 간접적이다
  낮음: 효과(또는 부담)가 작거나 근거상 확인되지 않는다
items:
  - id: STK-1
    name: 클라우드·데이터센터 운영자
    basis: 인프라 비용, 메모리 활용률, 운영 복잡도
    question: 운영자 관점에서 기대되는 비용·용량 효과와, 도입에 필요한 인프라 변경·운영 부담은 무엇인가
    axes: [기대 효과, 도입 부담]
  - id: STK-2
    name: 모델 개발사·서빙 엔지니어
    basis: 모델 구조 변경, 학습·재학습 비용, 서빙 엔진 통합
    question: 개발자 관점에서 기대되는 성능·비용 효과와, 모델·코드 변경, 재학습, 프레임워크 통합 부담은 무엇인가
    axes: [기대 효과, 도입 부담]
  - id: STK-3
    name: 하드웨어·인프라 공급사
    basis: 신규 시장, 제품 포트폴리오, 표준 참여
    question: 공급사 관점에서 기대되는 시장 기회와, 제품화·표준화·생태계 구축 부담은 무엇인가
    axes: [기대 효과, 도입 부담]
  - id: STK-4
    name: 최종 사용자·서비스 기업
    basis: 서비스 품질(지연, 컨텍스트 길이), 가격
    question: 사용자와 서비스 기업이 체감할 변화(응답 지연, 긴 컨텍스트, 가격)에 대한 공개 근거는 무엇인가
    axes: []
  - id: STK-5
    name: 규제·표준 기관
    basis: 표준화 동향, 정책·수출 통제
    question: 표준 기관과 정책 당국의 관련 동향(표준 채택, 규제)이 기술에 미치는 영향은 무엇인가
    axes: []
