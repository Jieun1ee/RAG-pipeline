# 도메인 적합성 항목. 데이터센터에서 이 기술을 쓸 때 실제로 달라지는 것을 본다.
# 수치가 나오면 측정 조건을 함께 적게 되어 있다. 조건이 다르면 같은 수치도 뜻이 달라진다.
perspective: domain
name: 도메인 적합성
basis: 데이터센터 기반 LLM Serving에서 KV 캐시 기술에 요구되는 성능·운영 요건
result_type: narrative
items:
  - id: DOM-1
    name: KV 캐시 메모리 절감
    basis: 추론 시 KV 캐시가 차지하는 GPU 메모리
    question: KV 캐시 메모리를 얼마나 줄이거나 확장하는가. 어떤 조건(모델, 컨텍스트 길이)에서 측정되었는가
  - id: DOM-2
    name: 처리량
    basis: 초당 토큰, 동시 요청 수
    question: 배치 크기·동시 요청 증가에 따른 처리량 변화가 확인되는가
  - id: DOM-3
    name: 지연시간
    basis: TTFT, TPOT, 꼬리 지연
    question: 첫 토큰 지연과 토큰당 지연에 어떤 영향을 주는가. 추가 지연(압축·복원, 메모리 계층 이동)이 있는가
  - id: DOM-4
    name: 긴 컨텍스트와 배치 확장성
    basis: 컨텍스트 길이, 배치 크기 한계
    question: 긴 컨텍스트(수만 토큰 이상)와 큰 배치에서 효과가 유지되거나 커지는가
  - id: DOM-5
    name: 모델 품질 영향
    basis: 정확도, 벤치마크 점수
    question: 기술 적용으로 모델 출력 품질이 유지되는가. 손실이 있다면 어느 정도인가
  - id: DOM-6
    name: 하드웨어 요구와 호환성
    basis: 필요한 하드웨어, 기존 장비와의 호환
    question: 특정 하드웨어(CXL 장치, 특정 GPU)가 필요한가. 기존 데이터센터 장비와 호환되는가
  - id: DOM-7
    name: 운영 복잡도와 통합 비용
    basis: 서빙 엔진 통합, 모니터링, 장애 대응
    question: 기존 서빙 엔진·운영 체계에 통합하는 데 드는 변경과 운영 복잡도는 어느 정도인가
  - id: DOM-8
    name: 에너지와 총소유비용
    basis: 전력, TCO
    question: 전력 소비와 총소유비용(TCO)에 미치는 영향이 확인되는가
