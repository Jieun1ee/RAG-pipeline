# 기술 조사 항목. 논문 본문에서 답을 찾아 기술을 있는 그대로 정리한다. 판정은 하지 않는다.
# id는 서술과 판정을 잇는 열쇠로 결과 파일에 그대로 실린다. 한번 정하면 바꾸지 않는다.
perspective: tech
name: 기술 조사
basis: 논문 원문 기반 사실 조사. 판정 없이 각 기술을 그 자체로 서술한다
result_type: narrative
items:
  - id: TECH-1
    name: 개요
    basis: 기술이 해결하려는 문제와 제안 배경
    question: 이 기술은 LLM 추론에서 어떤 문제(KV 캐시 메모리, 대역폭, 비용)를 풀기 위해 제안되었는가
  - id: TECH-2
    name: 핵심 메커니즘
    basis: 동작 원리와 구조
    question: KV 캐시를 어떤 방식으로 압축·저장·이동하는가. 핵심 구성 요소와 동작 순서는 무엇인가
  - id: TECH-3
    name: 적용 범위
    basis: 적용 가능한 모델·하드웨어·워크로드
    question: 어떤 모델 구조, 하드웨어, 서빙 워크로드(배치 크기, 컨텍스트 길이)에 적용되는가. 전제 조건은 무엇인가
  - id: TECH-4
    name: 한계
    basis: 논문이 스스로 밝힌 제약과 미해결 과제
    question: 논문이 인정한 한계, 트레이드오프, 추가 비용(학습, 하드웨어, 지연)은 무엇인가
  - id: TECH-5
    name: 보고 수치
    basis: 논문에 보고된 정량 결과와 측정 조건
    question: KV 캐시 절감률, 처리량, 지연시간 등 보고된 수치와 그 측정 조건(모델, 하드웨어, 설정)은 무엇인가
